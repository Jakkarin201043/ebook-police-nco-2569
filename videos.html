html,body{margin:0;height:100%;height:100dvh;background:#0f1115;overflow:hidden}
#room{position:fixed;inset:0}
/* ===== ห้องดูคลิป (video room) — shared by site/videos.html and the single-file overlay ===== */
.vr{--vr-bg:#0f1115;--vr-card:#181b22;--vr-card2:#20242d;--vr-fg:#eef0f4;--vr-sub:#9aa3b2;--vr-line:rgba(255,255,255,.09);--vr-acc:#f97316;--vr-red:#ef4444;
 position:relative;display:flex;flex-direction:column;height:100%;min-height:0;background:var(--vr-bg);color:var(--vr-fg);font-family:"SarabunUI","Sarabun","Noto Sans Thai","Leelawadee UI","Thonburi",Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.vr *{box-sizing:border-box}
.vr-head{flex:none;padding:10px 14px 8px;padding-top:max(10px,env(safe-area-inset-top));padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));background:rgba(15,17,21,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--vr-line);z-index:2}
.vr-row{display:flex;align-items:center;gap:10px}
.vr-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.vr-title .lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ef4444,#f97316);display:grid;place-items:center;flex:none}
.vr-title .lg svg{width:18px;height:18px;fill:#fff}
.vr-title b{display:block;font-size:17px;line-height:1.2}
.vr-title span{display:block;font-size:12px;color:var(--vr-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vr-back{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:12px;border:0;background:var(--vr-card2);color:var(--vr-fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.vr-back:active{transform:scale(.97)}
.vr-search{position:relative;margin-top:10px}
.vr-search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--vr-line);background:var(--vr-card);color:var(--vr-fg);font:inherit;font-size:15px;padding:0 40px 0 38px;outline:none;-webkit-appearance:none;appearance:none}
.vr-search input:focus{border-color:var(--vr-acc)}
.vr-search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.6;pointer-events:none}
.vr-search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--vr-sub);font-size:18px;cursor:pointer;display:none}
.vr-search.has .clr{display:block}
.vr-chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.vr-chips::-webkit-scrollbar{display:none}
.vr-chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--vr-line);background:var(--vr-card);color:var(--vr-fg);font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.vr-chip.on{background:var(--vr-acc);border-color:var(--vr-acc);color:#fff;font-weight:600}
.vr-chip .n{opacity:.7;font-size:12px;margin-left:4px}
.vr-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 14px 24px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.vr-off{display:none;margin-bottom:10px;padding:10px 12px;border-radius:12px;background:rgba(239,68,68,.14);color:#fecaca;font-size:13.5px;line-height:1.5}
.vr.offline .vr-off{display:block}
.vr-resume{display:none;align-items:center;gap:12px;margin-bottom:12px;padding:10px;border-radius:14px;background:linear-gradient(90deg,rgba(249,115,22,.18),rgba(239,68,68,.1));border:1px solid rgba(249,115,22,.35);cursor:pointer}
.vr-resume.show{display:flex}
.vr-resume img{width:96px;height:54px;border-radius:8px;object-fit:cover;flex:none;background:#222}
.vr-resume .t{flex:1;min-width:0}
.vr-resume .t small{display:block;color:var(--vr-acc);font-weight:700;font-size:12px}
.vr-resume .t b{display:block;font-size:14px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vr-meta{font-size:12.5px;color:var(--vr-sub);margin:2px 0 10px}
.vr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vr-card{display:flex;flex-direction:column;background:var(--vr-card);border:1px solid var(--vr-line);border-radius:14px;overflow:hidden;min-width:0}
.vr-card.primary{border-color:rgba(249,115,22,.35)}
.vr-th{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#2a2f3a,#1a1d24);cursor:pointer;overflow:hidden}
.vr-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vr-th .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--vr-sub);text-align:center;padding:10px}
.vr-th .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:38px;border-radius:12px;background:rgba(239,68,68,.92);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.vr-th .play svg{width:20px;height:20px;fill:#fff}
.vr-th .wd{position:absolute;right:8px;top:8px;padding:3px 8px;border-radius:999px;background:rgba(22,163,74,.92);color:#fff;font-size:11.5px;font-weight:700;display:none}
.vr-card.watched .vr-th .wd{display:block}
.vr-card.watched .vr-th img{opacity:.72}
.vr-th .sub{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vr-th.search{background:linear-gradient(135deg,#312e81,#1e1b4b)}
.vr-cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.vr-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vr-tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--vr-card2);color:var(--vr-sub)}
.vr-tag.subj{color:#fdba74;background:rgba(249,115,22,.14)}
.vr-tag.main{color:#86efac;background:rgba(22,163,74,.14)}
.vr-tag.srch{color:#c7d2fe;background:rgba(99,102,241,.18)}
.vr-ct{font-size:14.5px;font-weight:600;line-height:1.38;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer}
.vr-ch{font-size:12.5px;color:var(--vr-sub)}
.vr-desc{font-size:13px;line-height:1.5;color:#cfd4dc}
.vr-bk{font-size:12.5px;color:var(--vr-sub);border-top:1px dashed var(--vr-line);padding-top:7px;margin-top:auto}
.vr-bk b{color:var(--vr-fg);font-weight:600}
.vr-acts{display:flex;gap:8px;margin-top:4px}
.vr-acts button,.vr-acts a{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 10px;border-radius:10px;border:0;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.vr-acts .p{background:var(--vr-red);color:#fff}
.vr-acts .b{background:var(--vr-card2);color:var(--vr-fg)}
.vr-acts svg{width:15px;height:15px;fill:currentColor}
.vr-empty{padding:40px 10px;text-align:center;color:var(--vr-sub);font-size:14px;display:none}
.vr-empty.show{display:block}
mark.vr-hit{background:rgba(250,204,21,.35);color:inherit;border-radius:3px;padding:0 1px}
/* player */
.vr-pl{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.vr-pl.show{display:flex}
.vr-pc{width:min(960px,100%);max-height:100%;overflow:auto;background:var(--vr-card);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.vr-pv{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.vr-pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vr-pv .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px;font-size:14.5px}
.vr-pi{padding:12px 14px 14px}
.vr-pi h3{margin:0 0 4px;font-size:16.5px;line-height:1.4}
.vr-pi .ch{font-size:13px;color:var(--vr-sub)}
.vr-pi .ds{font-size:13.5px;line-height:1.55;color:#cfd4dc;margin:8px 0}
.vr-pi .bk{font-size:13px;color:var(--vr-sub)}
.vr-pa{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vr-pa a,.vr-pa button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:0;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.vr-pa .yt{background:var(--vr-red);color:#fff}
.vr-pa .bk2{background:var(--vr-acc);color:#fff}
.vr-pa .g{background:var(--vr-card2);color:var(--vr-fg)}
.vr-pa .x{margin-left:auto}

   vids.forEach((v,k)=>{

 function renderChips(){

  grid.innerHTML=list.map(card).join('');
  $('.vr-empty').classList.toggle('show',!list.length);
  const nv=items.filter(i=>i.id).length,nw=items.filter(i=>i.id&&st.watched[i.id]).length;
  $('.vr-meta').textContent=`แสดง ${list.length} จาก ${items.length} รายการ · ดูแล้ว ${nw}/${nv} คลิป`;
  const L=st.last&&items.find(i=>i.id===st.last.id);
  const r=$('.vr-resume');
  if(L&&!q&&filt==='all'){r.innerHTML=`<img alt="" src="${thumb(L)}" onerror="this.style.visibility='hidden'"><div class="t"><small>ดูล่าสุด — แตะเพื่อดูต่อ</small><b>${esc(L.title)}</b></div>`;r.dataset.k=L.key;r.classList.add('show')}else r.classList.remove('show');
 }
 const byKey=k=>items.find(i=>i.key===k);
 root.addEventListener('click',e=>{
  const r=e.target.closest('.vr-resume');if(r&&r.dataset.k){play(byKey(r.dataset.k));return}
  const a=e.target.closest('[data-act]');if(!a)return;const c=a.closest('.vr-card');if(!c)return;const it=byKey(c.dataset.k);if(!it)return;
  if(a.dataset.act==='play')play(it);else if(a.dataset.act==='book')o.onBook(it.p,it.tid);
 });
 let cur=null;
 function play(it){
  if(!it)return;
  if(it.search||!it.id){openExternal(it.url);return}
  cur=it;const url=it.url||'https://www.youtube.com/watch?v='+it.id;
  st.watched[it.id]=Date.now();st.last={id:it.id,t:Date.now()};save();
  const pv=$('.vr-pv');pv.innerHTML='';
  if(navigator.onLine===false){pv.innerHTML=`<div class="msg"><div style="font-size:30px">📡</div><div>ออฟไลน์ — เล่นคลิปไม่ได้ตอนนี้</div><div style="opacity:.7;font-size:13px">ต่อเน็ตแล้วแตะดูอีกครั้ง หรือกด “เปิดใน YouTube”</div></div>`}
  else{const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+it.id+'?rel=0&modestbranding=1&playsinline=1&autoplay=1';f.allow='accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;fullscreen';f.allowFullscreen=true;f.title=it.title;pv.appendChild(f)}
  $('.vr-pi h3').textContent=it.title;$('.vr-pi .ch').textContent=(it.channel||'')+' · '+it.subject;
  $('.vr-pi .ds').textContent=it.desc||'';$('.vr-pi .bk').textContent='ในหนังสือ: '+it.topic+' · หน้า '+it.p;
  const y=$('.vr-pa .yt');y.href=url;y.onclick=e=>{e.preventDefault();openExternal(url)};
  pl.classList.add('show');renderChips();render();
 }
 function closePl(){pl.classList.remove('show');$('.vr-pv').innerHTML='';cur=null}
 $('.vr-pa .x').onclick=closePl;pl.addEventListener('click',e=>{if(e.target===pl)closePl()});
 $('.vr-pa .bk2').onclick=()=>{const c=cur;closePl();if(c)o.onBook(c.p,c.tid)};
 $('.vr-pa .unw').onclick=()=>{if(cur){delete st.watched[cur.id];save();renderChips();render()}closePl()};
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&pl.classList.contains('show')){e.stopPropagation();closePl()}});
 let tm;inp.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{q=inp.value.trim();$('.vr-search').classList.toggle('has',!!q);render()},120)});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()});
 $('.vr-search .clr').onclick=()=>{inp.value='';q='';$('.vr-search').classList.remove('has');render();inp.focus()};
 const net=()=>root.classList.toggle('offline',navigator.onLine===false);
 addEventListener('online',net);addEventListener('offline',net);net();
 renderChips();render();
 return {refresh(){try{st=Object.assign({watched:{},last:null},JSON.parse(localStorage.getItem(SK)||'{}')||{})}catch(e){}build();renderChips();render()},close:closePl,get items(){return items},setQuery(s){inp.value=s;q=s;$('.vr-search').classList.toggle('has',!!q);render()},play:k=>play(byKey(k))};
}
window.VideoRoom={mount,norm};
})();

</script>
<script>
(function(){
 const BOOK=window.__BOOK||{title:'แนวข้อสอบนายสิบตำรวจ',toc:[],id:'police'};
 const root=document.getElementById('room');
 let lessons=null;
 function start(){
  window.VideoRoom.mount(root,{
   getLessons:()=>lessons,
   toc:BOOK.toc||[],
   subtitle:BOOK.title||'แนวข้อสอบนายสิบตำรวจ',
   storeKey:'ebook:'+(BOOK.id||'police')+':videos',
   ovKey:'ebook:'+(BOOK.id||'police')+':lessons',
   backHref:'index.html',
   onBook:(p,tid)=>{
    const h=tid!=null?('#topic='+tid):('#p='+p);
    location.href='index.html'+h;
   }
  });
 }
 fetch('lessons.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(d=>{
  lessons=d||window.__LESSONS||{topics:[]};
  start();
 }).catch(()=>{lessons=window.__LESSONS||{topics:[]};start()});
})();
</script>
